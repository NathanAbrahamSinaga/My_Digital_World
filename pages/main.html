<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTempest</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico">
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/background.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
    <div class="bg-container">
        <div class="city-bg"></div>
        <div class="clouds"></div>
        <div class="clouds" style="top: 20%; animation-delay: -10s; animation-duration: 25s;"></div>
        <div class="clouds" style="top: 5%; animation-delay: -5s; animation-duration: 30s;"></div>
        <div class="pixel-art-elements">
            <img src="/assets/images/1.gif" alt="Pixel art animation 1" class="bg-pixel-gif" id="pixel-gif-1">
            <img src="/assets/images/2.gif" alt="Pixel art animation 2" class="bg-pixel-gif" id="pixel-gif-2">
            <img src="/assets/images/4.gif" alt="Pixel art animation 3" class="bg-pixel-gif" id="pixel-gif-3">
            <img src="/assets/images/5.gif" alt="Pixel art animation 4" class="bg-pixel-gif" id="pixel-gif-4">
        </div>
    </div>

    <div id="rain-container"></div>
    
    <div id="blur-transition" class="blur-transition-overlay"></div>

    <div class="top-right-controls">
        <button id="theme-toggle-btn" class="control-btn" aria-label="Toggle Theme">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 11.25 12.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/>
            </svg>
        </button>
        <button id="music-toggle-btn" class="control-btn" aria-label="Toggle Music">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
        </button>
    </div>

    <button id="main-back-btn" class="back-btn" onclick="showMainMenu()">← Back</button>

    <div id="mainNav" class="main-nav">
        <button class="nav-btn" onclick="showPage('blog')">📚 Blog</button>
        <button class="nav-btn" onclick="showPage('music')">🎵 Music</button>
        <button class="nav-btn" onclick="showPage('art')">🖼️ Art</button>
        <button class="nav-btn" onclick="showPage('about')">🧩 About Me</button>
        <button class="nav-btn" onclick="goToZootopia()">🦊 Zootopia</button>
    </div>

    <div id="blogPage" class="page-content">
        <h1 class="page-header">📚 My Blog</h1>
        <div id="blogPosts" class="blog-posts"></div>
    </div>

    <div id="musicPage" class="page-content">
        <h1 class="page-header">🎵 Music</h1>
        <div id="musicContainer" class="music-container">
            <div id="musicListLeft" class="music-column"></div>
            <div id="musicListRight" class="music-column"></div>
        </div>
    </div>

    <div id="artPage" class="page-content">
        <h1 class="page-header">🖼️ Art</h1>
        <div id="galleryGrid" class="gallery-grid"></div>
    </div>

    <div id="aboutPage" class="page-content">
        <h1 class="page-header">🧩 Me</h1>
        <div id="aboutContent" class="about-content"></div>
    </div>

    <div id="image-modal" class="image-modal">
        <span id="close-modal-btn" class="close-modal-btn">×</span>
        <img class="modal-content" id="modal-image">
    </div>

    <script src="/js/theme-effects.js"></script>
    <script src="/js/page-navigation.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
