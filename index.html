<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XTempest</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/intro.css">
</head>
<body class="intro-page">
    <video autoplay muted loop id="intro-video-bg">
        <source src="assets/images/intro.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>

    <!-- Start Screen -->
    <div id="start-screen" class="start-screen">
        <div class="start-content">
            <h1 class="start-title">XTempest's World</h1>
            <p class="start-subtitle">A Voyage of Light and Echo</p>
            <button id="start-button" class="nes-btn is-primary">Start</button>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen" style="display: none;">
        <div class="loading-content">
            <img src="assets/images/loading.gif" alt="Pixel art stasiun kereta Jepang" class="loading-image">
            <div class="loading-bar-container">
                <div id="loadingBarFill" class="loading-bar-fill"></div>
            </div>
            <p class="loading-text">Loading...</p>
        </div>
    </div>

    <script src="js/intro.js"></script>
</body>
</html>
